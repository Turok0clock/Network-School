cq","domain":5,"topic":"Interfaces","prompt":"A switch interface shows rapidly increasing CRC errors. Which cause is MOST likely?","options":["Wrong DNS record","Expired DHCP lease","Physical-layer corruption such as bad cable or interference","Missing NTP"],"answer":"Physical-layer corruption such as bad cable or interference","explanation":"Physical-layer corruption such as bad cable or interference is the correct choice for this scenario. This tests Objective 5.2 (Cabling, physical, and interface issues). Physical-layer corruption such as bad cable or interference is the best answer for this scenario. The key objective is Interfaces; the distractors do not satisfy the requirement as directly. Exam lens: Use symptoms/counters/tools to isolate Layer 1 and interface problems.","objective":"5.2"}]}],"flashcards":[{"front":"OSI L2","back":"Frames, MAC addresses, switches, VLANs."},{"front":"OSI L3","back":"Packets, IP addressing, routing."},{"front":"OSI L4","back":"TCP/UDP, ports, segmentation, reliability/flow control."},{"front":"TCP 22","back":"SSH"},{"front":"TCP 443","back":"HTTPS"},{"front":"UDP/TCP 53","back":"DNS"},{"front":"UDP 67/68","back":"DHCP server/client"},{"front":"UDP 123","back":"NTP"},{"front":"UDP 161/162","back":"SNMP queries / traps"},{"front":"TCP 389","back":"LDAP"},{"front":"TCP 636","back":"LDAPS"},{"front":"TCP 49","back":"TACACS+"},{"front":"UDP 1812/1813","back":"RADIUS authentication/accounting"},{"front":"APIPA","back":"169.254.0.0/16 \u2014 typically DHCP failure"},{"front":"Private IPv4","back":"10/8, 172.16/12, 192.168/16"},{"front":"IPv6 link-local","back":"FE80::/10"},{"front":"IPv6 multicast","back":"FF00::/8"},{"front":"A record","back":"Hostname \u2192 IPv4"},{"front":"AAAA record","back":"Hostname \u2192 IPv6"},{"front":"PTR record","back":"IP \u2192 hostname"},{"front":"MX record","back":"Mail exchanger"},{"front":"CNAME","back":"Hostname alias"},{"front":"STP","back":"Prevents Layer 2 switching loops."},{"front":"LACP","back":"Negotiates link aggregation."},{"front":"802.1Q","back":"VLAN trunk tagging."},{"front":"Native VLAN","back":"Normally untagged VLAN on an 802.1Q trunk."},{"front":"SVI","back":"Layer 3 interface for a VLAN on a multilayer switch."},{"front":"PAT","back":"Many private hosts share one public IPv4 using ports."},{"front":"FHRP","back":"Resilient virtual default gateway."},{"front":"OSPF","back":"Link-state interior gateway protocol."},{"front":"BGP","back":"Inter-autonomous-system routing protocol."},{"front":"RTO","back":"Target time to restore service."},{"front":"RPO","back":"Maximum acceptable data loss measured in time."},{"front":"MTBF","back":"Average time between failures."},{"front":"MTTR","back":"Average time to repair/restore."},{"front":"NetFlow","back":"Traffic conversations/flow metadata."},{"front":"Protocol analyzer","back":"Captures and decodes packets."},{"front":"IP scanner","back":"Find active hosts."},{"front":"Port scanner","back":"Find open/listening services."},{"front":"Spectrum analyzer","back":"Find RF interference."},{"front":"OTDR","back":"Locate/measure fiber faults."},{"front":"TDR","back":"Locate copper cable faults by reflections."},{"front":"CRC errors","back":"Often cable/connector/EMI/physical corruption."},{"front":"Runts","back":"Ethernet frames below minimum valid size."},{"front":"Giants","back":"Frames above allowed size/MTU."},{"front":"Jitter","back":"Variation in packet delay; especially harmful to real-time voice/video."},{"front":"Latency","back":"Time delay across the network."},{"front":"Throughput","back":"Actual successful data transfer rate."},{"front":"Bandwidth","back":"Theoretical/max capacity."},{"front":"CIA \u2014 Confidentiality","back":"Prevent unauthorized disclosure."},{"front":"CIA \u2014 Integrity","back":"Prevent unauthorized modification."},{"front":"CIA \u2014 Availability","back":"Keep systems/data accessible."},{"front":"AAA \u2014 Authentication","back":"Who are you?"},{"front":"AAA \u2014 Authorization","back":"What may you do?"},{"front":"AAA \u2014 Accounting","back":"What did you do?"},{"front":"RADIUS","back":"Centralized network AAA, commonly UDP."},{"front":"LDAP","back":"Directory access/query protocol."},{"front":"TACACS+","back":"AAA using TCP 49; separates AAA functions."},{"front":"SIEM","back":"Aggregates and correlates security logs/events."},{"front":"IPS","back":"Detects and can actively block malicious traffic."},{"front":"DHCP snooping","back":"Blocks unauthorized DHCP replies on untrusted ports."},{"front":"WPA3 SAE","back":"Modern password-authenticated wireless handshake."},{"front":"2.4 GHz channels","back":"1, 6, 11 are commonly non-overlapping 20 MHz channels in the U.S."},{"front":"Full tunnel VPN","back":"All client traffic traverses the VPN."},{"front":"Split tunnel VPN","back":"Only selected corporate traffic traverses the VPN."},{"front":"MDF","back":"Main distribution frame / primary telecom room."},{"front":"IDF","back":"Intermediate distribution frame serving a local area/floor."},{"front":"UPS","back":"Immediate short-term battery backup."},{"front":"PDU","back":"Distributes power to rack devices."},{"front":"/24","back":"256 total IPv4 addresses; 254 traditional usable host addresses."},{"front":"/25","back":"128 total IPv4 addresses; 126 traditional usable host addresses."},{"front":"/26","back":"64 total IPv4 addresses; 62 traditional usable host addresses."},{"front":"/27","back":"32 total IPv4 addresses; 30 traditional usable host addresses."},{"front":"/28","back":"16 total IPv4 addresses; 14 traditional usable host addresses."},{"front":"/29","back":"8 total IPv4 addresses; 6 traditional usable host addresses."},{"front":"/30","back":"4 total IPv4 addresses; 2 traditional usable host addresses."}],"weakTopics":[{"name":"1.7 Subnetting","note":"Not completed yet. Focus on IPv4 masks, host counts, network/broadcast ranges, and selecting the correct subnet at N10-009 depth."},{"name":"4.2 Security threats","note":"Completed but marked for review. Revisit attack types, symptoms, and the best mitigation/response at N10-009 depth."},{"name":"Domain 5 Troubleshooting","note":"Not completed yet. Use focused practice after finishing the Messer Domain 5 videos."}],"domainNames":{"1":"Networking Concepts","2":"Network Implementation","3":"Network Operations","4":"Network Security","5":"Network Troubleshooting"},"domainCounts":{"1":21,"2":18,"3":17,"4":13,"5":21},"objectiveGuides":[{"objective":"1.1","domain":1,"title":"OSI model","examLens":"Use the OSI model to locate where a symptom belongs and which device/protocol operates there.","mustKnow":["L1 physical: signals, cabling, connectors","L2 data link: frames, MAC addresses, switching, VLANs","L3 network: IP and routing","L4 transport: TCP/UDP and ports","L5\u2013L7: sessions, data representation, applications"],"pitfalls":["Do not confuse a switch's normal forwarding role (L2) with a router's L3 role.","Port numbers belong to the transport/application conversation, not to Ethernet switching."]},{"objective":"1.2","domain":1,"title":"Appliances, applications, and functions","examLens":"Choose the device or network function that directly satisfies a scenario.","mustKnow":["Router, switch, firewall, IDS/IPS","Load balancer and proxy","NAS vs SAN","Wireless AP/controller","CDN, VPN, QoS, TTL"],"pitfalls":["IDS detects/alerts; IPS can actively block.","NAS is file-level storage; SAN is block-level storage."]},{"objective":"1.3","domain":1,"title":"Cloud concepts","examLens":"Recognize cloud service/deployment models and connectivity components without drifting into cloud-engineering depth.","mustKnow":["Public/private/hybrid cloud","SaaS, PaaS, IaaS","VPC/VNet-style isolated networks","Security groups and cloud gateways","NFV and elasticity/scalability"],"pitfalls":["IaaS gives the customer more infrastructure responsibility than SaaS.","Hybrid combines private/on-prem resources with public cloud resources."]},{"objective":"1.4","domain":1,"title":"Protocols and ports","examLens":"Know common protocol purpose, transport, and default port well enough to select or troubleshoot the correct service.","mustKnow":["HTTP 80 / HTTPS 443","SSH 22 / Telnet 23","DNS 53","DHCP 67/68","SNMP 161/162","LDAP 389 / LDAPS 636","RDP 3389","NTP 123"],"pitfalls":["DNS commonly uses UDP 53 for normal queries but can use TCP.","Do not pick a secure protocol's insecure counterpart when the scenario explicitly requires encryption."]},{"objective":"1.5","domain":1,"title":"Media, standards, and connectors","examLens":"Match distance, bandwidth, EMI, connector, and transceiver requirements to the correct medium.","mustKnow":["Copper vs fiber characteristics","Single-mode vs multimode fiber","Common Ethernet standards","RJ45 and fiber connector recognition","SFP/SFP+/QSFP transceivers","Plenum and shielding considerations"],"pitfalls":["Fiber is immune to EMI; copper is not.","Single-mode is preferred for longer distances."]},{"objective":"1.6","domain":1,"title":"Topologies and architectures","examLens":"Identify topology/architecture from a diagram or requirement and know the major tradeoffs.","mustKnow":["Star, mesh, point-to-point","Three-tier and collapsed core","Spine-and-leaf","On-prem vs cloud-hosted architecture"],"pitfalls":["Physical and logical topology are not always the same.","Spine-and-leaf is associated with predictable east-west data-center paths."]},{"objective":"1.7","domain":1,"title":"IPv4 addressing and subnetting","examLens":"Calculate network boundaries, usable hosts, masks, and whether addresses share a subnet.","mustKnow":["CIDR to mask conversion","Usable hosts = 2^hostbits - 2 for normal IPv4 subnets","Network and broadcast addresses","APIPA 169.254.0.0/16","Private IPv4 ranges","Default gateway must be reachable on the local subnet"],"pitfalls":["Network and broadcast addresses are not assignable to hosts.","Do not confuse number of addresses with number of usable hosts."]},{"objective":"1.8","domain":1,"title":"Modern networking concepts","examLens":"Recognize what SDN, VXLAN, zero trust, IaC, and IPv6 solve at Network+ depth.","mustKnow":["Control plane vs data plane","SDN centralized control concepts","VXLAN overlays","Zero trust principles","Infrastructure as code","IPv6 address basics"],"pitfalls":["Zero trust is a security model, not a single product.","SDN separates/control-centralizes decision logic; it does not eliminate forwarding devices."]},{"objective":"2.1","domain":2,"title":"Routing","examLens":"Read basic routing information and choose static/dynamic/default routing behavior.","mustKnow":["Static vs dynamic routes","Default route","Longest-prefix match concept","OSPF vs BGP purpose","NAT/PAT basics","First-hop redundancy concepts"],"pitfalls":["BGP is primarily inter-autonomous-system routing.","A more specific route is preferred over a less specific matching route."]},{"objective":"2.2","domain":2,"title":"Switching, VLANs, and STP","examLens":"Configure or diagnose access/trunk links, VLAN placement, and loop prevention.","mustKnow":["Access vs trunk ports","802.1Q tagging","Native VLAN concept","STP/RSTP and root bridge","LACP/link aggregation","Port/interface configuration basics"],"pitfalls":["A trunk carries multiple VLANs; an access port normally belongs to one VLAN.","Redundant Layer 2 links can create loops unless STP handles them."]},{"objective":"2.3","domain":2,"title":"Wireless networking","examLens":"Choose band/channel/security settings and troubleshoot coverage or compatibility issues.","mustKnow":["2.4 GHz vs 5 GHz vs 6 GHz characteristics","2.4 GHz non-overlapping channel planning","WPA2/WPA3","Enterprise vs personal authentication","SSID, channels, attenuation, interference"],"pitfalls":["2.4 GHz generally travels farther but has fewer clean channels and more interference.","A security-mode mismatch can prevent association even when signal strength is excellent."]},{"objective":"2.4","domain":2,"title":"Physical installation","examLens":"Select power, environmental, rack, and cabling choices that make a deployment safe and reliable.","mustKnow":["PoE concepts","UPS/PDU","Temperature/humidity/airflow","Rack placement and cable management","EMI and grounding concepts","MDF/IDF considerations"],"pitfalls":["A PoE power-budget problem can affect multiple endpoints even when data switching is fine.","Environmental symptoms can look intermittent and may not be protocol problems."]},{"objective":"3.1","domain":3,"title":"Documentation and lifecycle","examLens":"Know what documentation/process artifact should be used before, during, and after a network change.","mustKnow":["Physical/logical diagrams","Rack diagrams and cable maps","IPAM","Asset inventory","Baselines","Change/configuration management","EOL/EOS concepts"],"pitfalls":["A baseline describes normal operation; it is not the same as a backup.","Changes should be documented and validated, not performed ad hoc."]},{"objective":"3.2","domain":3,"title":"Monitoring and alerting","examLens":"Pick the right telemetry/logging tool and interpret what it tells you.","mustKnow":["SNMP polling/traps","Syslog","Flow data","Packet captures","Interface counters","SIEM/log aggregation concepts","Performance baselines"],"pitfalls":["Flow data summarizes conversations; packet capture exposes packet-level detail.","SNMP traps are event-driven notifications, while polling is queried."]},{"objective":"3.3","domain":3,"title":"Disaster recovery and high availability","examLens":"Match recovery/availability terminology and redundancy strategy to business requirements.","mustKnow":["RTO and RPO","MTTR/MTBF concepts","Active-active vs active-passive","Backups and redundancy","Failover testing"],"pitfalls":["RTO is about time to restore; RPO is about acceptable data loss measured in time.","Redundancy is not a substitute for backups."]},{"objective":"3.4","domain":3,"title":"Network services","examLens":"Configure and troubleshoot DHCP, DNS, and time services.","mustKnow":["DHCP scope, lease, reservation, relay","DNS A/AAAA/CNAME/MX/PTR concepts","SLAAC basics","NTP/PTP purpose","Gateway and DNS options"],"pitfalls":["APIPA usually signals failure to obtain IPv4 configuration from DHCP.","DNS resolution failure is different from IP reachability failure."]},{"objective":"3.5","domain":3,"title":"VPN and remote access","examLens":"Choose an appropriate remote connectivity method and its security characteristics.","mustKnow":["Client-to-site vs site-to-site VPN","Remote desktop concepts","SSH","Out-of-band vs in-band management","Secure remote administration"],"pitfalls":["Site-to-site connects networks; client-to-site connects an individual endpoint/user.","Prefer encrypted administration protocols over Telnet."]},{"objective":"4.1","domain":4,"title":"Security concepts and authentication","examLens":"Apply CIA, AAA, PKI, authentication, and access-control principles to networking scenarios.","mustKnow":["Confidentiality, integrity, availability","Authentication, authorization, accounting","RADIUS and TACACS+ concepts","Certificates/PKI","MFA and federation","Least privilege"],"pitfalls":["Authentication proves identity; authorization determines allowed actions.","Integrity is about unauthorized modification, not secrecy."]},{"objective":"4.2","domain":4,"title":"Attacks and threats","examLens":"Recognize attack symptoms and pair them with the most direct mitigation at Network+ depth.","mustKnow":["DoS/DDoS","VLAN hopping","MAC flooding","ARP poisoning","DNS poisoning","Rogue DHCP/AP concepts","Social engineering and malware"],"pitfalls":["MAC flooding targets a switch's CAM/MAC table behavior.","ARP poisoning manipulates local IP-to-MAC resolution; DNS poisoning targets name resolution."]},{"objective":"4.3","domain":4,"title":"Network hardening","examLens":"Choose controls that reduce attack surface and limit access.","mustKnow":["Disable unused ports/services","Change defaults","ACLs and segmentation","NAC/802.1X","Secure management protocols","Physical security","Least privilege"],"pitfalls":["Segmentation limits lateral movement; it is not just an organizational convenience.","Unused switch ports should not simply remain active with default settings."]},{"objective":"5.1","domain":5,"title":"Troubleshooting methodology","examLens":"Follow the troubleshooting process in the correct order and know when to escalate/document.","mustKnow":["Identify problem","Establish theory","Test theory","Plan and implement solution","Verify full functionality","Document findings/actions/outcomes"],"pitfalls":["Do not implement an untested guess before gathering evidence unless an emergency procedure explicitly requires it.","Verification comes after the fix, not before."]},{"objective":"5.2","domain":5,"title":"Cabling, physical, and interface issues","examLens":"Use symptoms/counters/tools to isolate Layer 1 and interface problems.","mustKnow":["CRC/FCS errors","Runts/giants","Duplex/speed issues","Bad cable/termination","Fiber polarity/dirty connectors","EMI","PoE issues"],"pitfalls":["Rising CRC errors strongly suggest a physical/interface problem.","A link light does not prove the cable is error-free."]},{"objective":"5.3","domain":5,"title":"Switching, routing, and IP issues","examLens":"Diagnose wrong VLANs, loops, bad routes, addressing, DHCP, DNS, and gateway problems.","mustKnow":["Wrong VLAN/trunk configuration","STP problems","Incorrect subnet mask/gateway","Duplicate IP","DHCP/APIPA","Routing table logic","ACL path issues","DNS resolution failures"],"pitfalls":["If ping by IP works but hostname fails, investigate DNS before cabling.","If only one routed application fails, inspect ACL/firewall rules and the relevant port."]},{"objective":"5.4","domain":5,"title":"Performance and wireless issues","examLens":"Distinguish latency, jitter, loss, congestion, interference, attenuation, and coverage issues.","mustKnow":["Latency vs jitter vs loss","Bandwidth vs throughput","Congestion","Wireless interference","Channel overlap","Signal attenuation","Roaming/coverage symptoms"],"pitfalls":["High bandwidth does not guarantee low latency.","Jitter is variation in delay, especially damaging to real-time traffic."]},{"objective":"5.5","domain":5,"title":"Tools and commands","examLens":"Choose the least invasive tool/command that directly tests the suspected layer or service.","mustKnow":["ping, tracert/traceroute, ipconfig/ifconfig/ip","nslookup/dig","netstat/ss","arp","route","tcpdump/packet capture","Cable tester, toner, loopback, Wi-Fi analyzer","Basic show commands"],"pitfalls":["An IP scanner discovers hosts; a port scanner discovers listening ports/services.","Use DNS tools for name-resolution evidence and path tools for hop/path evidence."]}],"quizBank":[{"id":"QB001","type":"mcq","domain":1,"objective":"1.1","topic":"OSI model","prompt":"A technician can see a switch port transition to up/up, but frames from the attached host show repeated FCS errors. At which OSI layer should the technician begin troubleshooting?","options":["Layer 1","Layer 3","Layer 4","Layer 7"],"answer":"Layer 1","explanation":"FCS/CRC errors commonly point to a physical signaling, cabling, connector, or interface problem. Start at the Physical layer before investigating higher-layer protocols."},{"id":"QB002","type":"mcq","domain":1,"objective":"1.2","topic":"Network appliances","prompt":"A company wants malicious traffic to be blocked automatically when known attack signatures are detected. Which device function BEST fits the requirement?","options":["IDS","IPS","Load balancer","Proxy cache"],"answer":"IPS","explanation":"An IPS is placed to detect and actively prevent/block malicious traffic. An IDS primarily detects and alerts."},{"id":"QB003","type":"mcq","domain":1,"objective":"1.3","topic":"Cloud","prompt":"A company keeps sensitive workloads on its own infrastructure but bursts non-sensitive workloads into a public provider during demand spikes. Which deployment model is being used?","options":["Public","Private","Hybrid","Community"],"answer":"Hybrid","explanation":"Hybrid cloud combines private/on-premises resources with public cloud resources."},{"id":"QB004","type":"mcq","domain":1,"objective":"1.4","topic":"Ports","prompt":"A secure directory service is reachable but the firewall team needs the default destination port for LDAPS. Which port should be permitted?","options":["389","443","636","3389"],"answer":"636","explanation":"LDAPS uses TCP 636 by default; LDAP without TLS commonly uses 389."},{"id":"QB005","type":"mcq","domain":1,"objective":"1.4","topic":"Protocols","prompt":"Clients can reach a web server by IP address but not by hostname. Which service should be tested FIRST?","options":["DHCP","DNS","NTP","SNMP"],"answer":"DNS","explanation":"Successful IP connectivity with failed hostname resolution points first to DNS."},{"id":"QB006","type":"mcq","domain":1,"objective":"1.5","topic":"Fiber","prompt":"A new uplink must cross several buildings over a long distance and pass near strong electrical equipment. Which medium is BEST?","options":["Cat 6 UTP","Cat 6a UTP","Multimode fiber","Single-mode fiber"],"answer":"Single-mode fiber","explanation":"Single-mode fiber supports long distances and is immune to EMI, making it the best fit."},{"id":"QB007","type":"mcq","domain":1,"objective":"1.6","topic":"Topologies","prompt":"A data center requires many predictable east-west paths between servers with consistent hop counts. Which architecture is MOST appropriate?","options":["Bus","Spine-and-leaf","Ring","Point-to-multipoint WAN"],"answer":"Spine-and-leaf","explanation":"Spine-and-leaf provides predictable, scalable east-west connectivity in data-center designs."},{"id":"QB008","type":"mcq","domain":1,"objective":"1.7","topic":"Subnetting","prompt":"A /27 IPv4 subnet is assigned to a department. How many usable host addresses are available?","options":["14","30","32","62"],"answer":"30","explanation":"A /27 leaves 5 host bits: 2^5 = 32 total addresses, minus network and broadcast = 30 usable."},{"id":"QB009","type":"mcq","domain":1,"objective":"1.7","topic":"Subnetting","prompt":"Which subnet mask corresponds to /26?","options":["255.255.255.0","255.255.255.128","255.255.255.192","255.255.255.224"],"answer":"255.255.255.192","explanation":"/26 has 26 network bits. The final octet is 11000000 binary, which equals 192."},{"id":"QB010","type":"mcq","domain":1,"objective":"1.8","topic":"SDN","prompt":"Which statement BEST describes software-defined networking?","options":["It removes all physical switching hardware","It separates centralized control logic from packet forwarding","It is a replacement for IP addressing","It encrypts all east-west traffic by default"],"answer":"It separates centralized control logic from packet forwarding","explanation":"SDN centralizes or abstracts control-plane decisions while forwarding still occurs in the data plane."},{"id":"QB011","type":"mcq","domain":2,"objective":"2.1","topic":"Routing","prompt":"A router has matching routes 10.10.0.0/16 and 10.10.20.0/24 for destination 10.10.20.45. Which route will be preferred?","options":["10.10.0.0/16","10.10.20.0/24","Both equally","The default route"],"answer":"10.10.20.0/24","explanation":"Routers prefer the most specific matching prefix. /24 is more specific than /16."},{"id":"QB012","type":"mcq","domain":2,"objective":"2.1","topic":"Routing","prompt":"A branch has a single WAN exit and no need to learn multiple external paths dynamically. Which route is MOST appropriate for unknown destinations?","options":["Host route","Default route","BGP route","Loopback route"],"answer":"Default route","explanation":"A default route provides a catch-all path when no more specific route matches."},{"id":"QB013","type":"mcq","domain":2,"objective":"2.2","topic":"VLANs","prompt":"A switch port connects to a normal user workstation in VLAN 30. Which port mode is MOST appropriate?","options":["Access VLAN 30","802.1Q trunk","Port mirror","Routed interface"],"answer":"Access VLAN 30","explanation":"A typical endpoint belongs to one VLAN and connects through an access port assigned to that VLAN."},{"id":"QB014","type":"mcq","domain":2,"objective":"2.2","topic":"STP","prompt":"After two switches are connected with redundant Layer 2 links, users experience a broadcast storm. Which technology should prevent this condition?","options":["OSPF","STP","NAT","VRRP"],"answer":"STP","explanation":"STP/RSTP prevents Layer 2 loops by placing redundant paths into a non-forwarding state when needed."},{"id":"QB015","type":"mcq","domain":2,"objective":"2.2","topic":"Trunking","prompt":"A switch uplink must carry VLANs 10, 20, and 30 to another switch. Which configuration is required?","options":["Access port","802.1Q trunk","SPAN destination","Loopback interface"],"answer":"802.1Q trunk","explanation":"An 802.1Q trunk carries traffic for multiple VLANs across one link."},{"id":"QB016","type":"mcq","domain":2,"objective":"2.3","topic":"Wireless","prompt":"A small office has three 2.4 GHz APs in nearby rooms. Which channel plan BEST reduces overlap in North America?","options":["1, 2, 3","1, 6, 11","3, 6, 9","6, 7, 8"],"answer":"1, 6, 11","explanation":"Channels 1, 6, and 11 are the standard non-overlapping 20 MHz choices in 2.4 GHz."},{"id":"QB017","type":"mcq","domain":2,"objective":"2.3","topic":"Wireless security","prompt":"An enterprise WLAN needs per-user authentication against centralized credentials. Which combination BEST fits?","options":["WPA2-Personal with PSK","WPA3-Enterprise with 802.1X/RADIUS","Open authentication with captive portal only","WEP with MAC filtering"],"answer":"WPA3-Enterprise with 802.1X/RADIUS","explanation":"Enterprise WLAN authentication uses 802.1X with an AAA backend such as RADIUS; WPA3-Enterprise provides strong wireless security."},{"id":"QB018","type":"mcq","domain":2,"objective":"2.4","topic":"PoE","prompt":"Several new IP cameras power on individually but some shut down when all are connected to one switch. Data links are otherwise normal. What should be checked FIRST?","options":["DNS TTL","PoE power budget","STP root priority","NTP stratum"],"answer":"PoE power budget","explanation":"If devices fail only when many PoE endpoints are active, the switch's total PoE budget may be exceeded."},{"id":"QB019","type":"mcq","domain":2,"objective":"2.4","topic":"Environment","prompt":"A switch in a closet becomes unstable only during hot afternoons. Which environmental condition is MOST relevant?","options":["High temperature / poor airflow","Incorrect DNS suffix","Duplicate MX record","Too many NTP peers"],"answer":"High temperature / poor airflow","explanation":"Heat and poor ventilation can cause intermittent hardware instability and should be checked before protocol settings."},{"id":"QB020","type":"mcq","domain":2,"objective":"2.1","topic":"NAT","prompt":"Hundreds of private IPv4 clients share one public IPv4 address while maintaining separate internet sessions. Which technology is being used?","options":["Static NAT","PAT","VXLAN","SLAAC"],"answer":"PAT","explanation":"PAT translates many private sessions through one public address by also translating transport-layer port numbers."},{"id":"QB021","type":"mcq","domain":3,"objective":"3.1","topic":"Documentation","prompt":"A technician wants to know which switch port and patch-panel port serve a specific wall jack. Which document is MOST useful?","options":["Cable map","RTO report","Certificate chain","DNS zone file"],"answer":"Cable map","explanation":"A cable map documents physical cabling paths, terminations, and port relationships."},{"id":"QB022","type":"mcq","domain":3,"objective":"3.1","topic":"Baselines","prompt":"An administrator wants evidence that today's 85% interface utilization is abnormal. What should be consulted?","options":["Performance baseline","Asset tag","RPO","Certificate revocation list"],"answer":"Performance baseline","explanation":"A baseline records normal performance and makes deviations such as unusually high utilization meaningful."},{"id":"QB023","type":"mcq","domain":3,"objective":"3.2","topic":"SNMP","prompt":"A monitoring server needs an immediate notification when a switch interface goes down. Which mechanism is BEST?","options":["SNMP trap","DNS PTR lookup","DHCP reservation","NAT translation"],"answer":"SNMP trap","explanation":"An SNMP trap is an event-driven notification sent by the device to the management system."},{"id":"QB024","type":"mcq","domain":3,"objective":"3.2","topic":"Monitoring","prompt":"An engineer needs to identify which source/destination pairs consume the most WAN bandwidth without collecting full packet payloads. Which data source is BEST?","options":["Flow records","ARP cache","Cable certification","RADIUS accounting only"],"answer":"Flow records","explanation":"NetFlow/IPFIX-style flow records summarize conversations and traffic volume without requiring full packet payload capture."},{"id":"QB025","type":"mcq","domain":3,"objective":"3.3","topic":"Disaster recovery","prompt":"A business states that service must be restored within two hours after an outage. Which metric is being specified?","options":["RPO","RTO","MTBF","TTL"],"answer":"RTO","explanation":"RTO is the target maximum time to restore service after disruption."},{"id":"QB026","type":"mcq","domain":3,"objective":"3.3","topic":"Disaster recovery","prompt":"A database may lose no more than 15 minutes of changes after a disaster. Which metric is this?","options":["RPO","RTO","MTTR","SLA uptime"],"answer":"RPO","explanation":"RPO defines the acceptable amount of data loss measured in time."},{"id":"QB027","type":"mcq","domain":3,"objective":"3.4","topic":"DHCP","prompt":"A client assigns itself 169.254.22.14/16. What is the MOST likely issue?","options":["It could not obtain IPv4 configuration from DHCP","DNSSEC validation failed","The switch elected the wrong STP root","The client received an IPv6 SLAAC address"],"answer":"It could not obtain IPv4 configuration from DHCP","explanation":"169.254.0.0/16 is APIPA/link-local IPv4, commonly used when DHCP configuration cannot be obtained."},{"id":"QB028","type":"mcq","domain":3,"objective":"3.4","topic":"DNS","prompt":"Which DNS record maps a hostname to an IPv6 address?","options":["A","AAAA","PTR","MX"],"answer":"AAAA","explanation":"AAAA records map hostnames to IPv6 addresses."},{"id":"QB029","type":"mcq","domain":3,"objective":"3.4","topic":"DHCP relay","prompt":"Clients in a new VLAN cannot reach a DHCP server located on another routed subnet, but static IP connectivity works. What is MOST likely missing?","options":["DHCP relay/IP helper","STP root guard","NAT overload","DNS MX record"],"answer":"DHCP relay/IP helper","explanation":"DHCP broadcasts do not normally cross routers; a relay/helper forwards DHCP requests to a remote server."},{"id":"QB030","type":"mcq","domain":3,"objective":"3.5","topic":"VPN","prompt":"Two branch offices need encrypted connectivity between their entire local networks. Which VPN type BEST fits?","options":["Client-to-site","Site-to-site","Split DNS","Out-of-band console"],"answer":"Site-to-site","explanation":"Site-to-site VPNs connect networks at separate locations through encrypted tunnels."},{"id":"QB031","type":"mcq","domain":4,"objective":"4.1","topic":"CIA triad","prompt":"A file is changed by an unauthorized user. Which security principle was violated?","options":["Confidentiality","Integrity","Availability","Accounting"],"answer":"Integrity","explanation":"Integrity protects against unauthorized or improper modification of data."},{"id":"QB032","type":"mcq","domain":4,"objective":"4.1","topic":"AAA","prompt":"A network device checks whether an authenticated administrator is allowed to enter configuration mode. Which AAA function is being performed?","options":["Authentication","Authorization","Accounting","Availability"],"answer":"Authorization","explanation":"Authorization determines what an authenticated identity is permitted to do."},{"id":"QB033","type":"mcq","domain":4,"objective":"4.1","topic":"RADIUS","prompt":"A company wants centralized authentication for 802.1X network access. Which service is MOST appropriate?","options":["RADIUS","NTP","SNMP","TFTP"],"answer":"RADIUS","explanation":"RADIUS is commonly used as the AAA backend for 802.1X network access."},{"id":"QB034","type":"mcq","domain":4,"objective":"4.2","topic":"Attacks","prompt":"A switch suddenly begins flooding frames out many ports after receiving a very large number of forged source MAC addresses. Which attack is MOST likely?","options":["MAC flooding","ARP poisoning","DNS poisoning","VLAN pruning"],"answer":"MAC flooding","explanation":"MAC flooding attempts to overflow a switch's MAC/CAM table using many forged source addresses."},{"id":"QB035","type":"mcq","domain":4,"objective":"4.2","topic":"Attacks","prompt":"Users are redirected to a malicious site even though they type the correct hostname. Investigation shows altered name-resolution responses. Which attack is MOST likely?","options":["DNS poisoning","MAC flooding","Evil twin only","VLAN hopping"],"answer":"DNS poisoning","explanation":"DNS poisoning manipulates name resolution so legitimate names resolve to malicious destinations."},{"id":"QB036","type":"mcq","domain":4,"objective":"4.2","topic":"Attacks","prompt":"A threat actor sends forged ARP replies so local hosts associate the default gateway IP with the attacker's MAC address. What attack is this?","options":["ARP poisoning","DNS poisoning","DDoS amplification","MAC filtering"],"answer":"ARP poisoning","explanation":"ARP poisoning corrupts local IP-to-MAC mappings and can enable on-path interception."},{"id":"QB037","type":"mcq","domain":4,"objective":"4.3","topic":"Hardening","prompt":"A newly installed switch has 20 unused access ports. Which action BEST reduces attack surface?","options":["Disable unused ports","Leave them active on VLAN 1","Configure all as trunks","Enable Telnet for support"],"answer":"Disable unused ports","explanation":"Unused physical switch ports should be disabled or otherwise secured so unauthorized devices cannot connect."},{"id":"QB038","type":"mcq","domain":4,"objective":"4.3","topic":"Segmentation","prompt":"A guest wireless network must reach the internet but must not communicate with internal user subnets. Which control MOST directly enforces this?","options":["ACL/firewall segmentation","NTP","Port mirroring","CDN"],"answer":"ACL/firewall segmentation","explanation":"Segmentation with ACL/firewall policy can permit internet access while denying paths into internal networks."},{"id":"QB039","type":"mcq","domain":4,"objective":"4.3","topic":"Secure management","prompt":"Which protocol should replace Telnet for encrypted command-line administration of network devices?","options":["SSH","FTP","SNMPv1","TFTP"],"answer":"SSH","explanation":"SSH encrypts remote terminal sessions; Telnet sends session data in cleartext."},{"id":"QB040","type":"mcq","domain":4,"objective":"4.1","topic":"Certificates","prompt":"A browser needs to verify that a server certificate chains back to a trusted issuer. What trust model is being used?","options":["PKI","PAT","STP","SLAAC"],"answer":"PKI","explanation":"PKI uses certificates, certificate authorities, and trust chains to establish identity and trust."},{"id":"QB041","type":"mcq","domain":5,"objective":"5.1","topic":"Methodology","prompt":"After identifying symptoms and gathering information, what should a technician do NEXT in a standard troubleshooting process?","options":["Establish a theory of probable cause","Immediately replace the router","Document the final fix","Close the ticket"],"answer":"Establish a theory of probable cause","explanation":"After identifying the problem, establish a likely cause that can be tested before implementing a fix."},{"id":"QB042","type":"mcq","domain":5,"objective":"5.2","topic":"Cabling","prompt":"A copper switch port remains up but shows rapidly increasing CRC errors. Which action should be performed FIRST?","options":["Inspect/test the patch cable and terminations","Change the DNS server","Increase DHCP lease time","Modify OSPF cost"],"answer":"Inspect/test the patch cable and terminations","explanation":"CRC/FCS errors point strongly to physical/interface corruption, so cabling and termination checks come first."},{"id":"QB043","type":"mcq","domain":5,"objective":"5.2","topic":"Fiber","prompt":"A newly installed duplex fiber link stays down. Both transceivers are compatible and powered. Which simple physical problem should be checked FIRST?","options":["Fiber polarity/TX-RX orientation","DNS suffix","DHCP reservation","NTP source"],"answer":"Fiber polarity/TX-RX orientation","explanation":"Duplex fiber requires one side's transmit to reach the other side's receive. Reversed polarity can keep the link down."},{"id":"QB044","type":"mcq","domain":5,"objective":"5.3","topic":"IP addressing","prompt":"A host is configured as 192.168.20.50/24 with gateway 192.168.30.1. Local hosts work, but remote networks do not. What is MOST likely wrong?","options":["The default gateway is not on the host's local subnet","The DNS TTL is too low","The switch needs a trunk","The host needs an MX record"],"answer":"The default gateway is not on the host's local subnet","explanation":"A normal host must reach its default gateway directly on the local subnet. 192.168.30.1 is outside 192.168.20.0/24."},{"id":"QB045","type":"mcq","domain":5,"objective":"5.3","topic":"DNS troubleshooting","prompt":"A user can ping 8.8.8.8 but cannot browse to sites by name. Which command BEST tests the suspected service?","options":["nslookup","traceroute only","arp -a","show mac address-table"],"answer":"nslookup","explanation":"The symptom points to name resolution; nslookup directly queries DNS and provides relevant evidence."},{"id":"QB046","type":"mcq","domain":5,"objective":"5.4","topic":"Performance","prompt":"VoIP audio arrives with uneven spacing even though very few packets are lost. Which metric BEST describes the issue?","options":["Jitter","Bandwidth","MTBF","TTL"],"answer":"Jitter","explanation":"Jitter is variation in packet delay and is especially noticeable in real-time voice/video."},{"id":"QB047","type":"mcq","domain":5,"objective":"5.4","topic":"Wireless","prompt":"Users near a microwave experience intermittent 2.4 GHz Wi-Fi degradation during lunch. Which cause is MOST likely?","options":["RF interference","DNS poisoning","Wrong RPO","VLAN pruning"],"answer":"RF interference","explanation":"Microwave energy overlaps the 2.4 GHz band and can cause intermittent interference."},{"id":"QB048","type":"mcq","domain":5,"objective":"5.5","topic":"Tools","prompt":"A technician needs to discover which TCP ports are listening on a server. Which tool type is MOST appropriate?","options":["Port scanner","IP scanner only","Cable tester","Wi-Fi analyzer"],"answer":"Port scanner","explanation":"A port scanner probes transport ports/services. An IP scanner primarily discovers hosts."},{"id":"QB049","type":"mcq","domain":5,"objective":"5.5","topic":"CLI","prompt":"Which command is MOST useful for viewing the hop-by-hop path toward a remote destination?","options":["traceroute/tracert","nslookup","arp","netstat"],"answer":"traceroute/tracert","explanation":"traceroute/tracert reveals the sequence of routed hops toward a destination and helps isolate path/latency issues."},{"id":"QB050","type":"mcq","domain":5,"objective":"5.5","topic":"Device commands","prompt":"A technician wants to inspect errors, speed, duplex, and counters on a switch interface. Which command category is MOST useful?","options":["show interface","show clock","show users","show hostname"],"answer":"show interface","explanation":"Interface status/counter commands expose link state, negotiated parameters, and error counters used for troubleshooting."}],"labs":[{"id":"LAB01","domain":1,"objective":"1.7","title":"Subnet a 30-host department","scenario":"Engineering needs a new IPv4 subnet that supports at least 30 usable hosts with the smallest normal subnet. The parent network is 192.168.50.0/24.","topology":["192.168.50.0/24","Engineering LAN","Default Gateway"],"fields":[{"label":"Smallest prefix that supports 30 usable hosts","options":["/27","/28","/26","/25"],"answer":"/27","why":"/27 provides 32 total IPv4 addresses and 30 usable host addresses.","hint":"Use 2^hostbits - 2 and pick the smallest subnet meeting the requirement."},{"label":"Subnet mask","options":["255.255.255.224","255.255.255.240","255.255.255.192","255.255.255.128"],"answer":"255.255.255.224","why":"A /27 mask is 255.255.255.224.","hint":"27 network bits leave 5 host bits."},{"label":"Network address for first subnet","options":["192.168.50.0","192.168.50.1","192.168.50.31","192.168.50.32"],"answer":"192.168.50.0","why":"The first /27 block begins at .0.","hint":"Block size is 32."},{"label":"Broadcast address for first subnet","options":["192.168.50.30","192.168.50.31","192.168.50.32","192.168.50.255"],"answer":"192.168.50.31","why":"The first /27 spans .0 through .31; .31 is broadcast.","hint":"Broadcast is the final address in the subnet."},{"label":"Valid gateway choice","options":["192.168.50.1","192.168.50.31","192.168.50.32","192.168.51.1"],"answer":"192.168.50.1","why":".1 is a usable host address within the subnet. .31 is broadcast and .32 is in the next subnet.","hint":"Pick any usable host address in the subnet."}],"skills":["CIDR","host counts","network/broadcast","gateway selection"]},{"id":"LAB02","domain":1,"objective":"1.7","title":"Determine whether hosts share a subnet","scenario":"Two workstations are configured with a /26 mask. Determine whether they can communicate directly without a router.","topology":["PC-A 10.20.30.62/26","LAN","PC-B 10.20.30.65/26"],"fields":[{"label":"PC-A network","options":["10.20.30.0/26","10.20.30.64/26","10.20.30.32/26","10.20.30.128/26"],"answer":"10.20.30.0/26","why":"With /26, block size is 64. Address .62 belongs to .0-.63.","hint":"/26 subnets increment by 64."},{"label":"PC-B network","options":["10.20.30.0/26","10.20.30.64/26","10.20.30.32/26","10.20.30.128/26"],"answer":"10.20.30.64/26","why":"Address .65 belongs to the .64-.127 subnet.","hint":"Find the nearest lower multiple of 64."},{"label":"Direct L2 communication without routing?","options":["Yes","No"],"answer":"No","why":"The hosts are in different IP subnets, so traffic between them requires a router/default gateway.","hint":"Compare network addresses after applying the mask."}],"skills":["subnet boundaries","same-subnet decision"]},{"id":"LAB03","domain":2,"objective":"2.2","title":"VLAN trunk and loop prevention","scenario":"Users are in VLAN 10 and IP phones are in VLAN 20. Two switches need a redundant uplink while carrying both VLANs.","topology":["Access SW1","Distribution SW","Access SW2"],"fields":[{"label":"Inter-switch uplink mode","options":["Access VLAN 10","802.1Q trunk","Routed loopback","Monitor port"],"answer":"802.1Q trunk","why":"A trunk is required to carry multiple VLANs between switches.","hint":"Multiple VLANs on one physical link implies trunking."},{"label":"User edge port","options":["Access VLAN 10","Trunk VLANs 10,20","Access VLAN 20","SPAN"],"answer":"Access VLAN 10","why":"A normal user endpoint should use an access port in its assigned VLAN.","hint":"Endpoint = access port unless the endpoint itself tags multiple VLANs."},{"label":"Phone VLAN","options":["VLAN 20","VLAN 1","Native VLAN only","No VLAN"],"answer":"VLAN 20","why":"The scenario explicitly places phones in VLAN 20.","hint":"Use the stated segmentation requirement."},{"label":"Loop-prevention mechanism","options":["STP/RSTP","BGP","NTP","PAT"],"answer":"STP/RSTP","why":"STP/RSTP prevents Layer 2 loops across redundant switch links.","hint":"Redundant switch links require a loop-prevention protocol."}],"skills":["VLANs","802.1Q","STP"]},{"id":"LAB04","domain":2,"objective":"2.1","title":"Choose the forwarding route","scenario":"A router must forward traffic to 10.10.20.45. The routing table contains several matching entries.","topology":["Client","Router","Destination"],"fields":[{"label":"Routes available","options":["10.10.0.0/16 via A","10.10.20.0/24 via B","0.0.0.0/0 via C"],"answer":"10.10.20.0/24 via B","why":"The /24 is the longest and therefore most specific matching prefix.","hint":"Choose the longest matching prefix."},{"label":"If the /24 route is removed","options":["Use 10.10.0.0/16 via A","Use default via C","Drop immediately","Use ARP across the WAN"],"answer":"Use 10.10.0.0/16 via A","why":"The /16 still matches and is more specific than the default route.","hint":"Re-evaluate the remaining matching routes."},{"label":"If no specific route matches","options":["Use default route if present","Broadcast the packet","Use DNS","Start STP"],"answer":"Use default route if present","why":"A default route is used when no more specific matching route exists.","hint":"0.0.0.0/0 is the catch-all IPv4 route."}],"skills":["routing table","longest prefix","default route"]},{"id":"LAB05","domain":2,"objective":"2.3","title":"Secure a three-AP office WLAN","scenario":"Three nearby APs serve employees. The company wants minimal 2.4 GHz overlap and centralized per-user authentication.","topology":["AP-1","AP-2","AP-3","RADIUS"],"fields":[{"label":"AP-1 2.4 GHz channel","options":["1","2","4","8"],"answer":"1","why":"Channel 1 is part of the standard 1/6/11 non-overlapping plan.","hint":"Start with one of 1, 6, 11."},{"label":"AP-2 2.4 GHz channel","options":["3","6","7","10"],"answer":"6","why":"Channel 6 is the middle non-overlapping choice in the 1/6/11 plan.","hint":"Avoid adjacent/overlapping channels."},{"label":"AP-3 2.4 GHz channel","options":["5","9","11","13"],"answer":"11","why":"Channel 11 completes the standard non-overlapping plan.","hint":"Use 1, 6, and 11."},{"label":"Authentication/security","options":["WPA3-Enterprise + 802.1X/RADIUS","Open","WEP","WPA2-Personal shared PSK"],"answer":"WPA3-Enterprise + 802.1X/RADIUS","why":"Enterprise authentication supports centralized per-user credentials through 802.1X/RADIUS.","hint":"Per-user enterprise auth implies 802.1X with AAA."}],"skills":["wireless channels","WPA3","802.1X","RADIUS"]},{"id":"LAB06","domain":5,"objective":"5.4","title":"Troubleshoot a wireless dead zone","scenario":"Users at one end of a warehouse see weak signal and intermittent disconnects. Nearby users are stable.","topology":["AP","Warehouse shelving","Affected clients"],"fields":[{"label":"Most likely first category","options":["Attenuation/coverage","DNS poisoning","RPO","BGP convergence"],"answer":"Attenuation/coverage","why":"Location-dependent weak signal points to RF coverage/attenuation before higher-layer services.","hint":"The problem changes with physical location."},{"label":"Best measurement tool","options":["Wi-Fi analyzer","Cable toner","Port scanner","SNMP trap receiver only"],"answer":"Wi-Fi analyzer","why":"A Wi-Fi analyzer can measure signal strength, channels, and interference at the affected location.","hint":"Use a wireless-specific tool."},{"label":"If metal shelving blocks the path","options":["Reposition/add AP based on survey","Lower DNS TTL","Change DHCP lease","Enable PAT"],"answer":"Reposition/add AP based on survey","why":"Physical obstacles can attenuate RF; AP placement should be adjusted using survey evidence.","hint":"Fix the RF path, not unrelated services."}],"skills":["wireless troubleshooting","attenuation","Wi-Fi analyzer"]},{"id":"LAB07","domain":3,"objective":"3.4","title":"Configure DHCP and DNS for a routed VLAN","scenario":"VLAN 30 is 10.20.30.0/24. Router interface is 10.20.30.1. DHCP server is remote. DNS is 10.10.5.53.","topology":["VLAN 30 Clients","Router 10.20.30.1","DHCP/DNS Services"],"fields":[{"label":"DHCP default gateway option","options":["10.20.30.1","10.10.5.53","255.255.255.0","169.254.1.1"],"answer":"10.20.30.1","why":"Clients use the router interface in their own subnet as the default gateway.","hint":"Gateway must be reachable on the local subnet."},{"label":"DNS server option","options":["10.10.5.53","10.20.30.1","127.0.0.1","224.0.0.1"],"answer":"10.10.5.53","why":"The scenario identifies 10.10.5.53 as DNS.","hint":"Use the stated service address."},{"label":"Remote DHCP support on router","options":["DHCP relay/IP helper","STP root guard","NAT loopback","Port mirror"],"answer":"DHCP relay/IP helper","why":"DHCP broadcasts need a relay to reach a server on another routed subnet.","hint":"Routers do not normally forward broadcasts."},{"label":"IPv4 hostname DNS record","options":["A","AAAA","PTR","MX"],"answer":"A","why":"An A record maps a hostname to an IPv4 address.","hint":"AAAA is IPv6; PTR is reverse lookup."}],"skills":["DHCP","relay","DNS records"]},{"id":"LAB08","domain":5,"objective":"5.3","title":"Diagnose APIPA clients","scenario":"Several clients in one VLAN show 169.254.x.x addresses. Other VLANs work normally.","topology":["Clients","Access Switch","Router/Relay","DHCP Server"],"fields":[{"label":"Meaning of 169.254.x.x","options":["APIPA/link-local IPv4","Valid DHCP scope","Public NAT pool","IPv6 link-local"],"answer":"APIPA/link-local IPv4","why":"169.254.0.0/16 indicates automatic private IPv4 addressing when normal configuration is unavailable.","hint":"Associate APIPA with DHCP failure."},{"label":"First service path to inspect","options":["DHCP request/relay path","NTP hierarchy","STP root for all VLANs","DNS MX record"],"answer":"DHCP request/relay path","why":"Only DHCP configuration is failing for that VLAN, so inspect DHCP scope/relay/reachability.","hint":"Match the symptom to the service."},{"label":"If DHCP server is remote","options":["Verify IP helper/relay on VLAN interface","Enable Telnet","Add default DNS suffix","Disable STP"],"answer":"Verify IP helper/relay on VLAN interface","why":"A missing or wrong relay prevents DHCP broadcasts from reaching a remote server.","hint":"Remote DHCP across routed boundaries requires a relay."}],"skills":["APIPA","DHCP troubleshooting","relay"]},{"id":"LAB09","domain":4,"objective":"4.3","title":"Segment a guest network","scenario":"Guests need internet access. They must not reach employee systems or the management VLAN.","topology":["Guest WLAN","Firewall/L3 boundary","Internet","Internal VLANs"],"fields":[{"label":"Guest-to-internet","options":["Permit required outbound traffic","Deny all","Permit only SMB","Permit only SNMP"],"answer":"Permit required outbound traffic","why":"The stated business requirement is internet access for guests.","hint":"Allow only the traffic needed for the requirement."},{"label":"Guest-to-internal VLANs","options":["Deny","Permit any","Trunk all VLANs","Bridge directly"],"answer":"Deny","why":"Segmentation should explicitly prevent guest access to internal networks.","hint":"Guest isolation requires a policy boundary."},{"label":"Management interfaces from guest VLAN","options":["Deny","Permit Telnet","Permit SNMP write","Permit any admin protocol"],"answer":"Deny","why":"Guest users should not access infrastructure management planes.","hint":"Least privilege and segmentation apply to management access."},{"label":"Unused access-switch ports","options":["Disable/secure","Leave active in default VLAN","Configure as trunks","Share admin credentials"],"answer":"Disable/secure","why":"Disabling unused ports reduces unauthorized physical access opportunities.","hint":"Reduce attack surface."}],"skills":["ACLs","segmentation","hardening"]},{"id":"LAB10","domain":4,"objective":"4.2","title":"Identify network attacks from evidence","scenario":"A SOC analyst is given four symptoms and must identify the most likely network attack.","topology":["Endpoint","Switch","Gateway","DNS"],"fields":[{"label":"Switch MAC table fills with thousands of forged source addresses","options":["MAC flooding","DNS poisoning","ARP poisoning","DDoS reflection"],"answer":"MAC flooding","why":"MAC flooding attempts to overflow the switch MAC/CAM table.","hint":"Focus on the switch MAC table."},{"label":"Gateway IP suddenly maps to an attacker's MAC on local hosts","options":["ARP poisoning","DNS poisoning","VLAN hopping","Malware only"],"answer":"ARP poisoning","why":"ARP poisoning corrupts local IP-to-MAC associations.","hint":"ARP = IP-to-MAC resolution."},{"label":"Correct hostname resolves to malicious IP","options":["DNS poisoning","MAC flooding","STP attack only","PoE exhaustion"],"answer":"DNS poisoning","why":"DNS poisoning manipulates name-resolution data.","hint":"Hostname-to-IP manipulation points to DNS."},{"label":"A host attempts to negotiate unauthorized trunking between VLANs","options":["VLAN hopping","ARP poisoning","NTP attack","RPO violation"],"answer":"VLAN hopping","why":"VLAN hopping abuses VLAN/trunk behavior to reach traffic outside the intended VLAN.","hint":"Look for unauthorized cross-VLAN/trunk behavior."}],"skills":["attack recognition","4.2 review"]},{"id":"LAB11","domain":4,"objective":"4.1","title":"Configure enterprise network access authentication","scenario":"Employee devices must authenticate before receiving normal wired network access. Authentication should be centralized.","topology":["Client Supplicant","802.1X Switch","RADIUS Server"],"fields":[{"label":"Access-control framework","options":["802.1X","STP","NAT","SNMP"],"answer":"802.1X","why":"802.1X provides port-based network access control using supplicant/authenticator/authentication server roles.","hint":"Think port-based access control."},{"label":"Central AAA service","options":["RADIUS","NTP","DNS","TFTP"],"answer":"RADIUS","why":"RADIUS commonly provides centralized AAA for network access.","hint":"802.1X commonly uses RADIUS as backend AAA."},{"label":"Identity proof stage","options":["Authentication","Authorization","Accounting","Availability"],"answer":"Authentication","why":"Authentication verifies identity."," const KEY="netplus_n10009_offline_v2";
const LEGACY_KEY="netplus_n10009_offline_v1";
const fresh=()=>({
  tracker:APP.tracker.map(x=>x.initial),
  review:APP.tracker.map(x=>!!x.reviewInitial),
  examState:{}, examResults:[],
  misses:{}, seen:{}, flashIndex:0,
  focusHistory:[], pbqHistory:[], labHistory:[], labState:{}, flashMastery:{}
});
let state;
try{
  const current=JSON.parse(localStorage.getItem(KEY));
  if(current){
    state=current;
    if(!Array.isArray(state.review)) state.review=APP.tracker.map(x=>!!x.reviewInitial);
    if(!Array.isArray(state.labHistory)) state.labHistory=[];
    if(!state.labState) state.labState={};
    if(!state.flashMastery) state.flashMastery={};
  }else{
    const legacy=JSON.parse(localStorage.getItem(LEGACY_KEY));
    state=fresh();
    if(legacy){
      ["examState","examResults","misses","seen","flashIndex","focusHistory","pbqHistory","labHistory","labState","flashMastery"].forEach(k=>{
        if(legacy[k]!==undefined) state[k]=legacy[k];
      });
    }
  }
}catch(e){state=fresh()}
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function show(id){
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.view===id));
  document.getElementById(id).classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
}
document.getElementById("tabs").onclick=e=>{let b=e.target.closest(".tab");if(!b)return;show(b.dataset.view);renderAll()};

function trackerStats(){
  let done=state.tracker.filter(Boolean).length;
  let review=(state.review||[]).filter(Boolean).length;
  return {done,review,total:APP.tracker.length,pct:done/APP.tracker.length*100};
}
function reviewGroups(){
  const groups={};
  APP.tracker.forEach((x,i)=>{
    if(state.review?.[i]){
      if(!groups[x.objective]) groups[x.objective]=[];
      groups[x.objective].push({title:x.title,index:i,complete:!!state.tracker[i]});
    }
  });
  return groups;
}
function examBest(id){let a=state.examResults.filter(x=>x.exam===id);return a.length?Math.max(...a.map(x=>x.score)):null}
function allMisses(){return Object.entries(state.misses).sort((a,b)=>b[1]-a[1])}
function domainLabel(d){return `${d}.0 ${APP.domainNames[d]}`}

function explainWrongChoice(q, selected){
  if(!selected) return "You did not select an answer.";

}

  if(!state.examState[id]||state.examState[id].finished){
    state.examState[id]={index:0,answers:{},flags:{},started:Date.now(),remaining:90*60,finished:false};

function runTimer(){
  clearInterval(timerHandle);
  timerHandle=setInterval(()=>{
    if(!activeExam)return;
    let s=state.examState[activeExam.id]; if(!s||s.finished)return clearInterval(timerHandle);
    s.remaining=Math.max(0,s.remaining-1); if(s.remaining%5===0)save();
    let el=document.getElementById("timer");if(el)el.textContent=fmt(s.remaining);
    if(s.remaining<=0){clearInterval(timerHandle);gradeExam()}
  },1000)
}
function fmt(sec){return `${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`}
function isAnswered(q,a){
  if(q.type==="mcq")return !!a;
  if(q.type==="pbq")return a && q.fields.every((f,i)=>a[i]);
  return false;
}
function renderExamQuestion(){
  const s=state.examState[activeExam.id], q=activeExam.questions[s.index], a=s.answers[q.id];
  let body="";
  if(q.type==="mcq"){
    body=q.options.map(o=>`<label class="option"><input type="radio" name="ea" value="${esc(o)}" ${a===o?"checked":""}><span>${esc(o)}</span></label>`).join("");
  }else{
    body=`<div class="pbqbox"><div class="topology"><div class="node">CLIENTS</div><div class="link"></div><div class="node">SWITCH / AP</div><div class="link"></div><div class="node">ROUTER / FW</div><div class="link"></div><div class="node">SERVICES</div></div>
    ${q.fields.map((f,i)=>`<div class="field"><strong>${esc(f.label)}</strong><select data-pf="${i}"><option value="">Choose…</option>${f.options.map(o=>`<option ${a&&a[i]===o?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`).join("")}</div>`;
  }
  let answered=activeExam.questions.map(x=>isAnswered(x,s.answers[x.id]));
  let grid=activeExam.questions.map((x,i)=>`<button class="qnum ${answered[i]?"answered":""} ${s.flags[i]?"flagged":""} ${i===s.index?"current":""}" data-qjump="${i}">${i+1}</button>`).join("");
  document.getElementById("examRunner").innerHTML=`<div class="qwrap">
  <div class="qtop"><button class="btn secondary" id="exitExam">Save & exit</button><div><strong>${esc(activeExam.title)}</strong> • <span class="timer" id="timer">${fmt(s.remaining)}</span></div></div>
  <div class="qgrid">${grid}</div>
  <div class="question"><div class="split"><span class="badge">Question ${s.index+1}/90</span><span class="badge">${domainLabel(q.domain)}</span><span class="badge">Obj ${esc(q.objective||"")}</span><span class="badge">${esc(q.topic)}</span>${q.type==="pbq"?'<span class="badge parked">PBQ</span>':""}</div><h3>${esc(q.title||q.prompt)}</h3>${q.title?`<p class="muted">${esc(q.prompt)}</p>`:""}${body}</div>
  <div class="navline"><div class="split"><button class="btn secondary" id="prevQ" ${s.index===0?"disabled":""}>Previous</button><button class="btn secondary" id="flagQ">${s.flags[s.index]?"Unflag":"Flag"}</button></div><div class="split"><button class="btn secondary" id="nextQ">${s.index===89?"Review":"Next"}</button><button class="btn good" id="submitExam">Grade exam</button></div></div>
  </div>`;
  if(q.type==="mcq")document.querySelectorAll('input[name="ea"]').forEach(x=>x.onchange=()=>{s.answers[q.id]=x.value;save();renderExamQuestion()});
  else document.querySelectorAll("[data-pf]").forEach(sel=>sel.onchange=()=>{let arr=s.answers[q.id]||Array(q.fields.length).fill("");arr[+sel.dataset.pf]=sel.value;s.answers[q.id]=arr;save()});
  document.querySelectorAll("[data-qjump]").forEach(b=>b.onclick=()=>{s.index=+b.dataset.qjump;save();renderExamQuestion()});
  document.getElementById("exitExam").onclick=()=>{clearInterval(timerHandle);activeExam=null;show("exams");renderAll()};
  document.getElementById("prevQ").onclick=()=>{s.index--;save();renderExamQuestion()};
  document.getElementById("nextQ").onclick=()=>{s.index=Math.min(89,s.index+1);save();renderExamQuestion()};
  document.getElementById("flagQ").onclick=()=>{s.flags[s.index]=!s.flags[s.index];save();renderExamQuestion()};
  document.getElementById("submitExam").onclick=()=>{let unanswered=activeExam.questions.filter(x=>!isAnswered(x,s.answers[x.id])).length;if(unanswered && !confirm(`${unanswered} questions are unanswered. Grade anyway?`))return;gradeExam()};
}
function gradeExam(){
  const s=state.examState[activeExam.id]; clearInterval(timerHandle);
  let correct=0, by={}; let detail=[];
  activeExam.questions.forEach(q=>{
    let a=s.answers[q.id],ok=false;
    if(q.type==="mcq")ok=a===q.answer;
    else ok=q.fields.every((f,i)=>a&&a[i]===f.answer);
    if(ok)correct++;
    else state.misses[q.topic]=(state.misses[q.topic]||0)+1;
    by[q.domain]??={c:0,n:0};by[q.domain].n++;if(ok)by[q.domain].c++;
    detail.push({id:q.id,ok});
  });
  let score=correct/90*100;
  state.examResults.push({exam:activeExam.id,date:new Date().toISOString(),score,correct,by});
  s.finished=true; save();
  renderExamResults("missed");
}
function renderExamResults(filter="missed"){
  const s=state.examState[activeExam.id];
  let correct=0,by={};
  activeExam.questions.forEach(q=>{
    const a=s.answers[q.id]; const ok=q.type==="mcq"?a===q.answer:q.fields.every((f,i)=>a&&a[i]===f.answer);
    if(ok)correct++;by[q.domain]??={c:0,n:0};by[q.domain].n++;if(ok)by[q.domain].c++;
  });
  const score=correct/90*100;
  const shown=activeExam.questions.filter(q=>{
    const a=s.answers[q.id];const ok=q.type==="mcq"?a===q.answer:q.fields.every((f,i)=>a&&a[i]===f.answer);
    return filter==="all"||!ok;
  });
  document.getElementById("examRunner").innerHTML=`<div class="qwrap">
    <div class="section-title"><h2>${esc(activeExam.title)} debrief</h2><span class="metric">${score.toFixed(1)}%</span></div>
    <div class="callout" style="margin-bottom:14px">This percentage is a diagnostic simulator score, not CompTIA's scaled 100–900 scoring. Use the domain breakdown and explanations to drive review.</div>
    <div class="grid">${Object.entries(by).map(([d,v])=>`<div class="card"><div class="label">${domainLabel(d)}</div><div class="metric">${v.c}/${v.n}</div><div class="muted">${(v.c/v.n*100).toFixed(1)}%</div></div>`).join("")}</div>
    <div class="review-controls"><button class="btn ${filter==="missed"?"":"secondary"}" id="missOnly">Missed only</button><button class="btn ${filter==="all"?"":"secondary"}" id="allReview">Review all 90</button></div>
    <div class="section-title"><h2>${filter==="all"?"All questions":"Missed questions"}</h2><span class="tiny">${shown.length} shown</span></div>
    ${shown.map((q,i)=>{
      const a=s.answers[q.id];const ok=q.type==="mcq"?a===q.answer:q.fields.every((f,j)=>a&&a[j]===f.answer);
      if(q.type==="mcq"){
        return `<details class="review-question ${ok?"review-correct":"review-incorrect"}" ${!ok?"open":""}>
          <summary><strong>${esc(q.prompt)}</strong><span class="badge ${ok?"complete-badge":"review-badge"}">${ok?"Correct":"Missed"}</span></summary>
          <div class="split"><span class="badge">${domainLabel(q.domain)}</span><span class="badge">Objective ${esc(q.objective)}</span><span class="badge">${esc(q.topic)}</span></div>
          <div class="review-answer-grid"><div><div class="label">Your answer</div><p class="${ok?"answer-good":"answer-bad"}">${esc(a||"No answer")}</p></div><div><div class="label">Correct answer</div><p class="answer-good">${esc(q.answer)}</p></div></div>
          ${!ok?`<div class="teaching-section"><div class="label">Why your answer missed the requirement</div><p>Your selection does not best satisfy the scenario. Re-read the requirement and identify which concept in Objective ${esc(q.objective)} directly addresses it.</p></div>`:""}
          <div class="teaching-section"><div class="label">Why the correct answer is right</div><p>${esc(q.explanation)}</p></div>
        </details>`;
      }else{
        return `<details class="review-question ${ok?"review-correct":"review-incorrect"}" open>
          <summary><strong>${esc(q.title||q.prompt)}</strong><span class="badge ${ok?"complete-badge":"review-badge"}">${ok?"Correct":"Missed"}</span></summary>
          <div class="split"><span class="badge">Objective ${esc(q.objective)}</span><span class="badge">PBQ</span></div>
          ${q.fields.map((f,j)=>{const ua=a&&a[j]||"No answer",fo=ua===f.answer;return `<div class="teaching-section"><strong>${esc(f.label)}</strong><br><span class="${fo?"answer-good":"answer-bad"}">Your answer: ${esc(ua)}</span><br><span class="answer-good">Correct: ${esc(f.answer)}</span></div>`}).join("")}
          <div class="teaching-section"><div class="label">Why</div><p>${esc(q.explanation)}</p></div>
        </details>`;
      }
    }).join("")||'<div class="result good">No missed questions.</div>'}
    <div class="navline"><button class="btn" id="backExams">Back to exams</button><div class="split"><button class="btn secondary" id="toLabs">PBQ Lab Center</button><button class="btn secondary" id="toFocus">Focus Lab</button></div></div>
  </div>`;
  document.getElementById("missOnly").onclick=()=>renderExamResults("missed");
  document.getElementById("allReview").onclick=()=>renderExamResults("all");
  document.getElementById("backExams").onclick=()=>{activeExam=null;show("exams");renderAll()};
  document.getElementById("toLabs").onclick=()=>{activeExam=null;show("labs");renderAll()};
  document.getElementById("toFocus").onclick=()=>{activeExam=null;show("focus");renderAll()};
}

function renderStats(){
  let rows=state.examResults.slice().reverse().map(r=>`<tr><td>${new Date(r.date).toLocaleDateString()}</td><td>Exam ${r.exam}</td><td>${r.correct}/90</td><td>${r.score.toFixed(1)}%</td></tr>`).join("");
  let miss=allMisses().slice(0,12).map(([t,n])=>`<tr><td>${esc(t)}</td><td>${n}</td></tr>`).join("");
  let labs=(state.labHistory||[]).slice().reverse().slice(0,12).map(r=>{const l=APP.labs.find(x=>x.id===r.lab);return `<tr><td>${new Date(r.date).toLocaleDateString()}</td><td>${esc(l?.title||r.lab)}</td><td>${r.correct}/${r.total}</td><td>${r.score.toFixed(0)}%</td></tr>`}).join("");
  const mastery=state.flashMastery||{},got=Object.values(mastery).filter(x=>x==="got").length,again=Object.values(mastery).filter(x=>x==="again").length;
  document.getElementById("stats").innerHTML=`<div class="section-title"><h2>Performance</h2><span class="tiny">Scores, labs, and study evidence</span></div><div class="grid">
    <div class="card wide"><h3>Exam history</h3><table class="stats-table"><thead><tr><th>Date</th><th>Exam</th><th>Correct</th><th>Diagnostic %</th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="muted">No full exams graded yet.</td></tr>'}</tbody></table></div>
    <div class="card"><h3>Most-missed topics</h3><table class="stats-table"><thead><tr><th>Topic</th><th>Misses</th></tr></thead><tbody>${miss||'<tr><td colspan="2" class="muted">No recorded misses yet.</td></tr>'}</tbody></table></div>
    <div class="card wide"><h3>PBQ lab history</h3><table class="stats-table"><thead><tr><th>Date</th><th>Lab</th><th>Fields</th><th>Score</th></tr></thead><tbody>${labs||'<tr><td colspan="4" class="muted">No PBQ labs completed yet.</td></tr>'}</tbody></table></div>
    <div class="card"><div class="label">Flashcard confidence</div><div class="metric">${got}</div><div class="muted">marked “Got it”</div><div style="margin-top:10px"><span class="badge review-badge">${again} revisit</span></div></div>
  </div>`;
}
function renderSettings(){
  document.getElementById("settings").innerHTML=`<div class="section-title"><h2>Offline data</h2></div><div class="grid">
  <div class="card wide"><h3>Backup your progress</h3><p class="muted">Your tracker, exam attempts, flags, answers, and miss history are stored with browser localStorage on this device. Export a JSON backup if you want a portable copy.</p><div class="split"><button class="btn" id="exportData">Export backup</button><label class="btn secondary">Import backup<input id="importData" type="file" accept=".json" style="display:none"></label></div></div>
  <div class="card"><h3>Reset</h3><p class="muted">Reset to the corrected tracker state: everything complete except 1.7 and Domain 5, with 4.2 flagged for review, and clear test history.</p><button class="btn bad" id="resetData">Reset all local data</button></div>
  </div>`;
  document.getElementById("exportData").onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="network-plus-study-backup.json";a.click();URL.revokeObjectURL(a.href)};
  document.getElementById("importData").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();renderAll();alert("Backup imported.")}catch(e){alert("That file is not a valid backup.")}};r.readAsText(f)};
  document.getElementById("resetData").onclick=()=>{if(confirm("Reset tracker and all study history?")){state=fresh();save();renderAll()}};
}
function renderAll(skipExam=true){renderDashboard();renderTracker();renderProfessor();renderLabs();renderFlash();renderFocus();renderExams();renderStats();renderSettings()}
renderAll();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
