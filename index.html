<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Network+ N10-009 Mission Lab</title>
<style>

:root{
  --bg:#070b14;
  --bg2:#0b111c;
  --panel:#101824;
  --panel2:#151f2e;
  --panel3:#0c141f;
  --text:#f5f8fb;
  --muted:#8fa0b5;
  --line:#263447;
  --line2:#34465e;
  --accent:#9bf00b;
  --accent2:#59e391;
  --accent-soft:rgba(155,240,11,.11);
  --cyan:#50d7ff;
  --purple:#a785ff;
  --good:#65e6a5;
  --bad:#ff7185;
  --warn:#ffd166;
  --shadow:0 18px 50px rgba(0,0,0,.32);
  --glow:0 0 0 1px rgba(155,240,11,.08),0 0 32px rgba(155,240,11,.06);
}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 14% -5%,rgba(80,215,255,.12),transparent 28rem),
    radial-gradient(circle at 87% 6%,rgba(155,240,11,.10),transparent 25rem),
    linear-gradient(180deg,#080d16 0%,#0a101a 38%,#070b14 100%);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.18;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:34px 34px;
  mask-image:linear-gradient(to bottom,black,transparent 75%);
}
button,select,input{font:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.shell{max-width:1240px;margin:auto;padding:22px 22px calc(100px + env(safe-area-inset-bottom))}
.top{
  position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:18px;
  margin-bottom:14px;padding:20px 22px;border:1px solid var(--line);border-radius:22px;
  background:linear-gradient(135deg,rgba(17,27,41,.96),rgba(10,18,29,.96));
  box-shadow:var(--shadow);
}
.top:after{
  content:"";position:absolute;width:300px;height:300px;border-radius:50%;right:-130px;top:-205px;
  background:radial-gradient(circle,rgba(155,240,11,.19),rgba(155,240,11,0) 70%);
  pointer-events:none;
}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.logo{
  position:relative;width:54px;height:54px;flex:0 0 54px;border-radius:15px;
  background:linear-gradient(145deg,#17271b,#0d1712);
  border:1px solid rgba(155,240,11,.55);display:grid;place-items:center;
  color:var(--accent);font-size:20px;font-weight:950;letter-spacing:-.04em;box-shadow:0 0 28px rgba(155,240,11,.14);
}
.logo:after{content:"";position:absolute;inset:6px;border:1px solid rgba(155,240,11,.17);border-radius:10px}
h1{font-size:23px;letter-spacing:-.03em;margin:0}
.sub{color:var(--muted);font-size:13px;margin-top:5px}
.tabs{
  position:sticky;top:0;z-index:20;display:flex;gap:7px;overflow:auto;padding:10px 4px 11px;margin:0 -4px 8px;
  background:linear-gradient(180deg,rgba(7,11,20,.96),rgba(7,11,20,.85));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  min-height:44px;border:1px solid transparent;background:transparent;color:#8fa0b5;padding:9px 13px;border-radius:12px;
  white-space:nowrap;font-size:13px;font-weight:750;transition:.18s ease;
}
.tab:hover{color:#dce7f2;background:#111a26}
.tab.active{
  color:#ecffca;border-color:rgba(155,240,11,.28);background:var(--accent-soft);
  box-shadow:inset 0 0 20px rgba(155,240,11,.035)
}
.view{display:none;animation:fadein .18s ease}.view.active{display:block}
@keyframes fadein{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{
  position:relative;overflow:hidden;grid-column:span 4;
  background:linear-gradient(155deg,rgba(18,28,42,.98),rgba(12,20,31,.98));
  border:1px solid var(--line);border-radius:18px;padding:18px;
  box-shadow:0 10px 32px rgba(0,0,0,.20);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;
}
.card:hover{transform:translateY(-1px);border-color:#35485f;box-shadow:0 15px 38px rgba(0,0,0,.25)}
.card:before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:linear-gradient(180deg,var(--accent),transparent 80%);opacity:.45}
.card.wide{grid-column:span 8}.card.full{grid-column:1/-1}
.card h3{margin:8px 0 11px;letter-spacing:-.015em}
.metric{font-size:32px;line-height:1.05;font-weight:900;letter-spacing:-.045em;margin-top:8px}
.label{
  color:#a9b8c9;font-size:11px;text-transform:uppercase;letter-spacing:.13em;font-weight:800
}
.bar{
  height:11px;background:#070c13;border-radius:999px;overflow:hidden;border:1px solid #1e2b3b;
  box-shadow:inset 0 1px 5px #0008
}
.bar>div{
  height:100%;border-radius:inherit;background:linear-gradient(90deg,#67db80,var(--accent));
  box-shadow:0 0 18px rgba(155,240,11,.30)
}
.btn{
  min-height:43px;border:1px solid rgba(155,240,11,.38);
  background:linear-gradient(180deg,#1d351b,#142815);color:#eaffce;padding:10px 15px;border-radius:11px;
  font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.18);transition:.16s ease
}
.btn:hover{transform:translateY(-1px);border-color:rgba(155,240,11,.7);box-shadow:0 7px 22px rgba(155,240,11,.08)}
.btn:active{transform:translateY(0)}
.btn.secondary{background:#111a26;border-color:#2a394c;color:#cfdae7}
.btn.good{background:#133124;border-color:#2c7957;color:#caffdf}
.btn.bad{background:#351821;border-color:#783041;color:#ffd2d9}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.section-title{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:26px 0 12px}
.section-title h2{margin:0;font-size:20px;letter-spacing:-.025em}
.section-title h2:after{content:"";display:inline-block;width:26px;height:3px;margin-left:10px;border-radius:5px;background:var(--accent);vertical-align:middle;opacity:.85}
.tiny{font-size:12px;color:var(--muted)}
.tracker-row{
  display:grid;grid-template-columns:auto 70px 1fr auto;align-items:center;gap:11px;
  padding:11px 10px;border-bottom:1px solid #1c2837;transition:.15s ease
}
.tracker-row:hover{background:rgba(255,255,255,.02)}
.tracker-row:last-child{border-bottom:0}
.tracker-row input{width:20px;height:20px;accent-color:var(--accent)}
.badge,.pill{
  display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;
  background:#121e2c;color:#b8c7d7;font-size:10.5px;font-weight:750;border:1px solid #2c3d52
}
.top>.badge{position:relative;z-index:1;color:#d9ffc5;border-color:rgba(155,240,11,.24);background:rgba(155,240,11,.07)}
.parked{background:#302916;color:#ffe090;border-color:#5d4d22}
.exam-card{display:flex;flex-direction:column;gap:10px;min-height:220px}
.exam-card:after{
  content:"SIM";position:absolute;right:14px;top:12px;font-size:38px;font-weight:950;letter-spacing:-.08em;color:rgba(255,255,255,.025)
}
.exam-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:auto}
.pill{color:#bcd0e4;background:#0d1722}
.qwrap{max-width:920px;margin:0 auto}
.qtop{
  position:sticky;top:64px;z-index:18;display:flex;justify-content:space-between;gap:12px;align-items:center;
  margin-bottom:12px;padding:8px;border:1px solid rgba(38,52,71,.75);border-radius:14px;background:rgba(8,13,22,.88);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)
}
.timer{font-variant-numeric:tabular-nums;font-weight:900;color:var(--accent)}
.question{
  position:relative;background:linear-gradient(155deg,#111c2a,#0c1520);border:1px solid #2b3b4f;border-radius:18px;padding:20px;
  box-shadow:var(--shadow)
}
.question:before{content:"";position:absolute;top:0;left:20px;right:20px;height:1px;background:linear-gradient(90deg,transparent,rgba(80,215,255,.55),transparent)}
.question h3{font-size:18px;line-height:1.5;margin:14px 0 16px}
.option{
  display:flex;gap:11px;align-items:flex-start;padding:13px 14px;border:1px solid #27384b;border-radius:12px;margin:9px 0;
  background:#0d1621;transition:.15s ease
}
.option:hover{border-color:#3b516b;background:#111c2a}
.option:has(input:checked){border-color:rgba(155,240,11,.62);background:rgba(155,240,11,.075);box-shadow:var(--glow)}
.option input{margin-top:3px;transform:scale(1.16);accent-color:var(--accent)}
.navline{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;margin-top:14px}
.qgrid{display:grid;grid-template-columns:repeat(15,1fr);gap:5px;margin:14px 0}
.qnum{
  min-height:31px;padding:6px 0;border-radius:8px;border:1px solid #26374a;background:#0d1621;color:#8496aa;font-size:11px
}
.qnum.answered{background:#143122;color:#bfffdc;border-color:#28593f}
.qnum.flagged{outline:2px solid var(--warn);outline-offset:1px}
.qnum.current{border-color:var(--accent);color:#efffd6;box-shadow:0 0 16px rgba(155,240,11,.11)}
.pbqbox{
  border:1px solid #334a62;background:linear-gradient(180deg,#0a1420,#0b111a);border-radius:15px;padding:14px;margin:15px 0;
  box-shadow:inset 0 0 30px rgba(80,215,255,.025)
}
.topology{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;padding:15px 8px}
.node{
  min-width:104px;text-align:center;border:1px solid #3c607c;background:linear-gradient(180deg,#12283a,#0d1b29);
  border-radius:11px;padding:13px 11px;font-size:11px;font-weight:850;letter-spacing:.06em;color:#cfefff;box-shadow:0 0 20px rgba(80,215,255,.04)
}
.link{height:2px;width:62px;background:linear-gradient(90deg,#3d6d8c,var(--cyan));position:relative;box-shadow:0 0 8px rgba(80,215,255,.25)}
.link:after{content:"";position:absolute;right:-1px;top:-4px;border-left:7px solid var(--cyan);border-top:5px solid transparent;border-bottom:5px solid transparent}
.field{display:grid;grid-template-columns:1fr 1fr;gap:11px;align-items:center;padding:9px 2px;border-bottom:1px solid #1e2c3a}
.field:last-child{border-bottom:0}
.field select,.select{
  width:100%;background:#0b131e;color:#eef5fb;border:1px solid #30435a;border-radius:10px;padding:10px 11px;
  outline:none
}
.field select:focus,.select:focus{border-color:rgba(155,240,11,.6);box-shadow:0 0 0 3px rgba(155,240,11,.06)}
.result{padding:14px;border-radius:12px;margin:11px 0}
.result.good{background:#112f21;border:1px solid #337555}
.result.bad{background:#361922;border:1px solid #7d3445}
.flash{
  position:relative;min-height:300px;display:grid;place-items:center;text-align:center;
  background:
    radial-gradient(circle at 50% 10%,rgba(155,240,11,.12),transparent 45%),
    linear-gradient(155deg,#121f2d,#0b131d 70%);
  border:1px solid #32455c;border-radius:22px;padding:34px;box-shadow:var(--shadow);overflow:hidden
}
.flash:before{content:"FLASH // N10-009";position:absolute;top:15px;left:17px;font-size:10px;font-weight:850;letter-spacing:.12em;color:#648095}
.flash:after{content:"TAP TO REVEAL";position:absolute;bottom:15px;font-size:9px;letter-spacing:.18em;color:rgba(155,240,11,.48)}
.flash .front{font-size:30px;font-weight:900;letter-spacing:-.035em}
.flash .back{font-size:20px;line-height:1.5;color:#d6e2ee;display:none;max-width:760px}
.flash.revealed .front{display:none}.flash.revealed .back{display:block}
.weak{
  position:relative;padding:12px 13px 12px 15px;border:1px solid #293a4d;border-radius:11px;background:#0d1722;margin:8px 0
}
.weak:before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--warn);opacity:.7}
.weak strong{display:block;margin-bottom:4px}
.stats-table{width:100%;border-collapse:collapse}
.stats-table td,.stats-table th{padding:10px;border-bottom:1px solid #223043;text-align:left}
.stats-table th{color:#8fa5bb;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.callout{
  border:1px solid #2d4354;border-left:3px solid var(--cyan);background:#0e1b27;border-radius:10px;padding:13px 14px;color:#dce9f4
}
.muted{color:var(--muted)}.split{display:flex;gap:9px;flex-wrap:wrap}
.select{width:auto;min-width:150px}

/* Dashboard mission styling */
.mission-hero{
  position:relative;overflow:hidden;display:grid;grid-template-columns:1.55fr .8fr;gap:16px;
  padding:24px;margin:2px 0 15px;border:1px solid #293b50;border-radius:21px;
  background:
    radial-gradient(circle at 85% 10%,rgba(155,240,11,.14),transparent 20rem),
    linear-gradient(120deg,#111d2a,#0a131e 70%);
  box-shadow:var(--shadow)
}
.mission-hero:after{
  content:"N10-009";position:absolute;right:22px;bottom:-24px;font-size:96px;font-weight:950;letter-spacing:-.08em;color:rgba(255,255,255,.025)
}
.hero-kicker{font-size:10px;color:var(--accent);font-weight:900;letter-spacing:.16em;text-transform:uppercase}
.hero-title{font-size:31px;line-height:1.08;letter-spacing:-.045em;margin:8px 0 9px;max-width:620px}
.hero-copy{max-width:680px;color:#a9b9c9;line-height:1.55;margin:0}
.hero-side{align-self:center;border-left:1px solid #2b3c50;padding-left:18px}
.hero-side .metric{color:#efffd9}
.status-dot{display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 11px var(--accent)}
.quick-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.path-card .path-step{display:flex;align-items:center;gap:10px;margin:10px 0}
.path-card .path-step:before{content:"";width:9px;height:9px;border:2px solid #53677d;border-radius:50%;background:#0b121b}
.path-card .path-step.done:before{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px rgba(155,240,11,.28)}
.path-card .path-step.next:before{border-color:var(--cyan);box-shadow:0 0 10px rgba(80,215,255,.20)}
.skill-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;margin:4px 4px 0 0;border-radius:9px;background:#0e1824;border:1px solid #26394d;font-size:11px;color:#b9c8d7}
.skill-chip:before{content:"#";color:var(--accent);font-weight:900}
.mini-ring{
  width:76px;height:76px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--accent) var(--p),#1b2736 0);position:relative
}
.mini-ring:before{content:"";position:absolute;inset:7px;border-radius:50%;background:#101925}
.mini-ring span{position:relative;z-index:1;font-size:13px;font-weight:900}

@media(max-width:780px){
  .card,.wide{grid-column:1/-1}.grid{gap:10px}.shell{padding:10px 10px calc(86px + env(safe-area-inset-bottom))}
  .top{padding:14px;border-radius:16px;align-items:flex-start}.top>.badge{display:none}
  .logo{width:46px;height:46px;flex-basis:46px}.brand h1{font-size:18px}.sub{font-size:11px;line-height:1.35}
  .tabs{top:0;margin-top:3px}.tab{min-height:42px;padding:8px 11px}
  .qgrid{grid-template-columns:repeat(10,1fr)}.field{grid-template-columns:1fr}.metric{font-size:28px}
  .mission-hero{grid-template-columns:1fr;padding:19px}.hero-side{border-left:0;border-top:1px solid #2b3c50;padding:14px 0 0}
  .hero-title{font-size:25px}.mission-hero:after{font-size:62px;right:10px}
  .qtop{top:60px}.question{padding:16px}
}


/* Review-aware tracker */
.tracker-head{
  display:grid;grid-template-columns:42px 70px 1fr 96px;gap:10px;padding:9px 10px;
  color:#71879c;font-size:10px;font-weight:850;letter-spacing:.1em;text-transform:uppercase;
  border-bottom:1px solid #27384b
}
.tracker-row{grid-template-columns:42px 70px 1fr 96px}
.tracker-row.reviewing{background:linear-gradient(90deg,rgba(255,209,102,.06),transparent 55%)}
.tracker-row.reviewing .tracker-title{color:#fff0bb}
.review-toggle{
  min-height:34px;border:1px solid #33465a;border-radius:9px;background:#0c151f;color:#8fa1b4;
  font-size:11px;font-weight:800;padding:6px 8px
}
.review-toggle.active{color:#ffe394;border-color:#7a642d;background:#2d2615;box-shadow:0 0 16px rgba(255,209,102,.07)}
.review-metric{color:var(--warn)}
.tracker-kpis{display:grid;grid-template-columns:150px 150px 1fr;gap:22px;align-items:center}
.tracker-progress{min-width:0}
.review-group{padding:11px 0;border-bottom:1px solid #233244}
.review-group:last-child{border-bottom:0}
.review-group-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.review-badge{background:#302815;color:#ffe394;border-color:#665326}
.complete-badge{background:#133223;color:#bfffd9;border-color:#2b6949}
.review-video{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 0;font-size:12px;color:#c6d3df}
@media(max-width:780px){
  .tracker-head{grid-template-columns:35px 54px 1fr 82px;gap:6px;padding-left:6px;padding-right:6px}
  .tracker-row{grid-template-columns:35px 54px 1fr 82px;gap:6px;padding-left:6px;padding-right:6px}
  .tracker-row .badge{padding:4px 6px}.review-toggle{font-size:10px;padding:5px}
  .tracker-kpis{grid-template-columns:1fr 1fr}.tracker-progress{grid-column:1/-1}
}


/* Teaching-focused quiz feedback */
.teaching-panel{
  margin-top:16px;padding:16px;border-radius:14px;border:1px solid #314258;background:#0c1621
}
.correct-panel{border-color:#2f6f50;background:linear-gradient(180deg,#102b20,#0c1813)}
.incorrect-panel{border-color:#7d3445;background:linear-gradient(180deg,#301821,#160d11)}
.teaching-status{font-size:18px;font-weight:900;margin-bottom:14px}
.correct-panel .teaching-status{color:var(--good)}
.incorrect-panel .teaching-status{color:#ff96a5}
.teaching-section{padding:11px 0;border-top:1px solid rgba(255,255,255,.07)}
.teaching-section:first-of-type{border-top:0}
.teaching-section p{margin:6px 0 0;line-height:1.6;color:#d3deea}
.option.teaching-correct{border-color:#3d8a63!important;background:#123425!important}
.option.teaching-wrong{border-color:#943b50!important;background:#371923!important}
.review-question{
  margin:12px 0;padding:18px;border-radius:16px;border:1px solid #2b3b4e;background:#0e1823;
  box-shadow:0 8px 24px rgba(0,0,0,.16)
}
.review-correct{border-left:4px solid var(--good)}
.review-incorrect{border-left:4px solid var(--bad)}
.review-qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.review-question h3{font-size:16px;line-height:1.5;margin:14px 0}
.review-answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0}
.review-answer-grid>div{padding:12px;border-radius:11px;background:#0a131d;border:1px solid #223244}
.answer-good{color:#bfffd9;font-weight:800}
.answer-bad{color:#ffacb8;font-weight:800}
@media(max-width:780px){
  .review-answer-grid{grid-template-columns:1fr}
}


/* Professor Desk */
.prof-layout{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(0,1.45fr);gap:14px}
.guide-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;align-content:start}
.guide-card{text-align:left;border:1px solid #28394d;background:#0e1823;color:var(--text);border-radius:13px;padding:13px;min-height:108px}
.guide-card:hover{border-color:#436078;background:#111d2a}.guide-card.priority{border-left:3px solid var(--warn)}
.guide-card strong{display:block;margin:9px 0 5px}.guide-top{display:flex;justify-content:space-between;gap:6px}
.professor-detail{position:sticky;top:76px;align-self:start;border:1px solid #2b3d51;border-radius:18px;padding:20px;background:linear-gradient(155deg,#111c29,#0b141f);box-shadow:var(--shadow)}
.professor-detail h2{font-size:25px;margin:12px 0}
.prof-columns{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:18px}
.prof-point{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid #1f2d3d;color:#d5e0ea;line-height:1.45}
.prof-point span{color:var(--good);font-weight:900}.prof-point.trap span{color:var(--warn)}

/* Lab Center */
.lab-toolbar{display:flex;align-items:center;gap:12px;margin-bottom:13px}
.lab-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.lab-card{display:flex;flex-direction:column;gap:9px;border:1px solid #293b50;border-radius:16px;padding:16px;background:linear-gradient(155deg,#101b28,#0b141e);box-shadow:0 9px 25px rgba(0,0,0,.18)}
.lab-card h3{margin:3px 0;font-size:17px}.lab-card p{font-size:12px;line-height:1.45;margin:0}.lab-skills{margin-bottom:auto}
.lab-score{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #213043;padding-top:10px;font-size:11px;color:var(--muted)}
.lab-score strong{color:#dce8f2}
.lab-field{padding:12px 4px;border-bottom:1px solid #203040}.lab-field:last-child{border-bottom:0}
.lab-field-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,.8fr) auto;gap:10px;align-items:center}
.lab-field-main select{background:#09131d;color:white;border:1px solid #30445a;padding:10px;border-radius:9px}
.field-feedback{margin-top:10px;padding:10px 12px;border-radius:9px;font-size:12px;line-height:1.55}
.good-feedback{background:#102c20;border:1px solid #2d6b4c;color:#ccfbe0}.bad-feedback{background:#321820;border:1px solid #733245;color:#ffd0d8}
.field-hint{font-size:11px;color:#6f8195;margin-top:7px}.field-correct{border-left:3px solid var(--good);padding-left:10px}.field-wrong{border-left:3px solid var(--bad);padding-left:10px}
.flash-grade{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:12px}
.review-controls{display:flex;gap:9px;margin:17px 0 4px}
details.review-question summary{cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;list-style:none}
details.review-question summary::-webkit-details-marker{display:none}
details.review-question[open] summary{margin-bottom:14px}
@media(max-width:900px){.lab-grid{grid-template-columns:1fr 1fr}.prof-layout{grid-template-columns:1fr}.professor-detail{position:static}}
@media(max-width:650px){.lab-grid,.guide-grid,.prof-columns{grid-template-columns:1fr}.lab-field-main{grid-template-columns:1fr}.prof-layout{display:block}.professor-detail{margin-top:12px}}

tion":"Packet loss is the correct choice for this scenario. This tests Objective 5.4 (Performance and wireless issues). Packet loss is the best answer for this scenario. The key objective is Performance; the distractors do not satisfy the requirement as directly. Exam lens: Distinguish latency, jitter, loss, congestion, interference, attenuation, and coverage issues.","objective":"5.4"},{"id":"E1-D2-15-stp","type":"mcq","domain":2,"topic":"STP","prompt":"A company is redesigning part of its enterprise network. Which of the following protocol prevents Layer 2 loops by placing redundant switch links into a blocking state?","options":["BGP","DHCP","STP","NAT"],"answer":"STP","explanation":"STP is the correct choice for this scenario. This tests Objective 2.2 (Switching, VLANs, and STP). STP is the best answer for this scenario. The key objective is STP; the distractors do not satisfy the requirement as directly. Exam lens: Configure or diagnose access/trunk links, VLAN placement, and loop prevention.","objective":"2.2"},{"id":"E1-D1-4-cdn","type":"mcq","domain":1,"topic":"CDN","prompt":"During a maintenance window, an administrator validates the network design. Which service places cached content near geographically distributed users to reduce retrieval latency?","options":["NTP","SAN","NAC","CDN"],"answer":"CDN","explanation":"CDN is the correct choice for this scenario. This tests Objective 1.2 (Appliances, applications, and functions). CDN is the best answer for this scenario. The key objective is CDN; the distractors do not satisfy the requirement as directly. Exam lens: Choose the device or network function that directly satisfies a scenario.","objective":"1.2"},{"id":"E1-D4-1-cia-c","type":"mcq","domain":4,"topic":"CIA triad","prompt":"A technician is preparing a change for a branch office. Which CIA-triad principle prevents unauthorized disclosure of information?","options":["Availability","Integrity","Non-repudiation","Confidentiality"],"answer":"Confidentiality","explanation":"Confidentiality is the correct choice for this scenario. This tests Objective 4.1 (Security concepts and authentication). Confidentiality is the best answer for this scenario. The key objective is CIA triad; the distractors do not satisfy the requirement as directly. Exam lens: Apply CIA, AAA, PKI, authentication, and access-control principles to networking scenarios.","objective":"4.1"},{"id":"E1-D1-17-ldaps636","type":"mcq","domain":1,"topic":"Ports","prompt":"Which port is the default for LDAPS?","options":["636","389","3389","1433"],"answer":"636","explanation":"636 is the correct choice for this scenario. This tests Objective 1.4 (Protocols and ports). 636 is the best answer for this scenario. The key objective is Ports; the distractors do not satisfy the requirement as directly. Exam lens: Know common protocol purpose, transport, and default port well enough to select or troubleshoot the correct service.","objective":"1.4"},{"id":"E1-D2-3-bgp","type":"mcq","domain":2,"topic":"Routing","prompt":"A company is redesigning part of its enterprise network. Which of the following routing protocol is primarily used to exchange routes between autonomous systems?","options":["VRRP","RIP","BGP","STP"],"answer":"BGP","explanation":"BGP is the correct choice for this scenario. This tests Objective 2.1 (Routing). BGP is the best answer for this scenario. The key objective is Routing; the distractors do not satisfy the requirement as directly. Exam lens: Read basic routing information and choose static/dynamic/default routing behavior.","objective":"2.1"},{"id":"E1-D3-11-syslog","type":"mcq","domain":3,"topic":"Logging","prompt":"Which system centralizes event messages from routers, switches, and firewalls using standardized severity levels?","options":["Syslog server","RADIUS proxy only","NAT gateway","DHCP relay"],"answer":"Syslog server","explanation":"Syslog server is the correct choice for this scenario. This tests Objective 3.2 (Monitoring and alerting). Syslog server is the best answer for this scenario. The key objective is Logging; the distractors do not satisfy the requirement as directly. Exam lens: Pick the right telemetry/logging tool and interpret what it tells you.","objective":"3.2"},{"id":"E1-D4-4-aaa-authn","type":"mcq","domain":4,"topic":"AAA","prompt":"During a maintenance window, an administrator validates the network design. Which AAA function verifies a user's identity?","options":["Authorization","Accounting","Authentication","Availability"],"answer":"Authentication","explanation":"Authentication is the correct choice for this scenario. This tests Objective 4.1 (Security concepts and authentication). Authentication is the best answer for this scenario. The key objective is AAA; the distractors do not satisfy the requirement as directly. Exam lens: Apply CIA, AAA, PKI, authentication, and access-control principles to networking scenarios.","objective":"4.1"},{"id":"E1-D5-14-aclblock","type":"mcq","domain":5,"topic":"Routing/security","prompt":"Only one application fails across a routed boundary; ping works. What should be checked NEXT?","options":["Rack airflow","Fiber polarity","UPS runtime","ACL/firewall rules for the application's protocol and port"],"answer":"ACL/firewall rules for the application's protocol and port","explanation":"ACL/firewall rules for the application's protocol and port is the correct choice for this scenario. This tests Objective 5.3 (Switching, routing, and IP issues). ACL/firewall rules for the application's protocol and port is the best answer for this scenario. The key objective is Routing/security; the distractors do not satisfy the requirement as directly. Exam lens: Diagnose wrong VLANs, loops, bad routes, addressing, DHCP, DNS, and gateway problems.","objective":"5.3"},{"id":"E1-D5-19-latency","type":"mcq","domain":5,"topic":"Performance","prompt":"A technician is preparing a change for a branch office. A cloud application responds slowly even with sufficient ba
